# Maestro Master Test Suite
# BrainLog Android E2E Testing
# Runs all flows in sequence

appId: com.brainlog

flows:
  # Authentication flows
  - flows/auth/login_success.yaml
  - flows/auth/logout.yaml

  # Navigation flows
  - flows/navigation/tab_navigation.yaml
  - flows/navigation/stack_navigation.yaml

  # Notes domain
  - flows/notes/note_crud.yaml
  - flows/notes/note_list.yaml

  # Flashcards domain
  - flows/flashcards/flashcard_crud.yaml
  - flows/flashcards/review_session.yaml

  # Voice Notes domain
  - flows/voiceNotes/voice_note_list.yaml
  - flows/voiceNotes/record_voice_note.yaml

  # Profile domain
  - flows/profile/profile_screen.yaml
  - flows/profile/habits_crud.yaml
  - flows/profile/settings.yaml

  # Calendar domain
  - flows/calendar/calendar_navigation.yaml
  - flows/calendar/daily_log.yaml

  # Search
  - flows/search/search_flow.yaml

  # Bookmarks
  - flows/bookmarks/bookmark_crud.yaml

  # Videos
  - flows/videos/video_list.yaml

  # Memorize
  - flows/memorize/memorize_crud.yaml
  - flows/memorize/memorize_review.yaml

  # Insights
  - flows/insights/weekly_summary.yaml
